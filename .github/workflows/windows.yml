# Windows 11 x64 构建：vcpkg 编译 OpenSceneGraph 3.6.5（MSVC，动态库），
# 打包为免安装 zip（exe + DLL + osgPlugins-3.6.5），并用 --check 自检全部模型
name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # 固定 vcpkg 版本，保证依赖可复现、二进制缓存可命中
  VCPKG_COMMIT: d4c0a46cb8f63e5c9fa007d13baf1cb3e43bf7e3
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
  TRIPLET: x64-windows-release

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout $env:VCPKG_COMMIT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Restore vcpkg binary cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ env.TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ env.TRIPLET }}-${{ env.VCPKG_COMMIT }}-

      - name: Configure (vcpkg installs OSG here)
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=$env:TRIPLET
          -DVCPKG_HOST_TRIPLET=$env:TRIPLET

      # 首次编译依赖耗时较长，失败时也保存已编好的包，下次可续上
      - name: Save vcpkg binary cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ env.TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $inst = "build/vcpkg_installed/$env:TRIPLET"
          $out  = "dist/ModelBrowser"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/bin/Release/ModelBrowser.exe $out
          Copy-Item "$inst/bin/*.dll" $out
          Copy-Item "$inst/plugins/osgPlugins-3.6.5" $out -Recurse
          Get-ChildItem $out | Format-Table Name, Length
          "{0:N1} MB" -f ((Get-ChildItem $out -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Smoke test (load every model, headless)
        shell: pwsh
        run: |
          $p = Start-Process dist/ModelBrowser/ModelBrowser.exe -ArgumentList '--check', 'model' `
                 -Wait -PassThru -NoNewWindow `
                 -RedirectStandardOutput check-out.txt -RedirectStandardError check-err.txt
          Get-Content check-out.txt
          Get-Content check-err.txt | Select-Object -First 40
          exit $p.ExitCode

      - uses: actions/upload-artifact@v4
        with:
          name: ModelBrowser-win64
          path: dist/

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive dist/ModelBrowser ModelBrowser-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ModelBrowser-win64.zip
